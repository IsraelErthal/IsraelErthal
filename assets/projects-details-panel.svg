<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a12"/>
      <stop offset="100%" stop-color="#07100d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="380" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="378" rx="13" fill="none" stroke="#173a24" stroke-width="2"/>
  <rect width="900" height="36" rx="14" fill="#0d1f15"/>
  <rect y="22" width="900" height="14" fill="#0d1f15"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#5fae7a">cat ./projects/details.log</text>

  <g font-family="Consolas, monospace">
    <text x="36" y="74" font-size="16" fill="#39ff14" filter="url(#glow)">[01] ALPHA WE ARE ONE</text>
    <text x="36" y="96" font-size="13.5" fill="#7fffb0">Site oficial da Alpha Scuderia, equipe de STEM Racing mais premiada do</text>
    <text x="36" y="115" font-size="13.5" fill="#7fffb0">Brasil, 5ª colocada no campeonato mundial 25/26.</text>

    <text x="36" y="150" font-size="16" fill="#39ff14" filter="url(#glow)">[02] SISTEMA GUARDA-VIDAS</text>
    <text x="36" y="172" font-size="13.5" fill="#7fffb0">Registro de check-in/check-out dos guarda-vidas da praia do Arroio do</text>
    <text x="36" y="191" font-size="13.5" fill="#7fffb0">Silva/SC. Demanda real do Corpo de Bombeiros de Criciúma.</text>

    <text x="36" y="226" font-size="16" fill="#39ff14" filter="url(#glow)">[03] BIBLIOTECA SESI/SENAI</text>
    <text x="36" y="248" font-size="13.5" fill="#7fffb0">Reserva de salas de estudo e computadores pelos alunos, com relatórios</text>
    <text x="36" y="267" font-size="13.5" fill="#7fffb0">de uso e gráficos por período. Demanda da biblioteca SESI/SENAI.</text>

    <text x="36" y="302" font-size="16" fill="#39ff14" filter="url(#glow)">[04] PERSON-PORTFOLIO</text>
    <text x="36" y="324" font-size="13.5" fill="#7fffb0">Ambiente experimental com terminal, árvore de diretórios e módulos</text>
    <text x="36" y="343" font-size="13.5" fill="#7fffb0">bloqueados, hospedado em Cloudflare Workers.</text>
  </g>
</svg>
